[project]
name = "competitor-monitor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "typer",
    "httpx",
    "feedparser",
    "rapidfuzz",
    "anthropic",
    "jinja2",
    "sqlalchemy>=2",
    "psycopg[binary]>=3.1",
    "tzdata; sys_platform == 'win32'",  # Windows 에는 시간대 DB 가 없어 ZoneInfo("Asia/Seoul") 가 실패한다
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.j2", "*.jsonl"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# 규칙을 명시해 ruff 버전(로컬·CI)에 따라 기본 규칙이 달라지지 않게 한다
select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "C4", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# typer.Option() 기본값은 typer 표준 사용법, 브랜드 하나 실패해도 나머지는 계속 수집
"app/__main__.py" = ["B008", "BLE001"]
# C 담당 파일의 zip() — 담당자가 고치면 이 줄을 지운다
"app/analysis/eval/run_eval.py" = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
