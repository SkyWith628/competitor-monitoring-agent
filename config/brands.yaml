# 브랜드별 수집 대상 (담당: B 주도, site 항목은 A)
# site.shopping — 네이버 쇼핑 검색 API로 상품·가격을 받는다 (공식몰은 robots.txt·봇 차단으로 직접 수집하지 않음)
#   queries      검색어. 검색어마다 최신 등록순 max_items(기본 300)개까지 본다
#   brand_names  상품의 '브랜드' 칸이 이 중 하나인 상품만 남긴다 (공백·대소문자 무시)
#   malls        (선택) 공식 판매처 이름. 채우면 그 판매처 상품만 남긴다 → 재판매처 최저가가 섞이지 않는다
#                실제 수집 결과의 mallName 을 보고 채울 것 (TODO(A))
brands:
  spao:
    name: 스파오
    site:
      shopping:
        queries: ["스파오"]
        brand_names: ["스파오", "SPAO"]
        malls: []
    news:
      keywords: ["스파오", "SPAO"]
      exclude: []         # TODO(B): 무관 기사 제외어
    sns:
      instagram: "spao_kr"                                # 스파오
      youtube_channel_id: "UC5flcGYBM2_QmA3JKdM9-YA"   # @spaokorea (SPAO 스파오)

  8seconds:
    name: 에잇세컨즈
    site:
      shopping:
        queries: ["에잇세컨즈"]
        brand_names: ["에잇세컨즈", "8seconds", "8 seconds"]
        malls: []
    news:
      keywords: ["에잇세컨즈", "8seconds"]
      exclude: []
    sns:
      instagram: "8seconds_official"                      # 8seconds (에잇세컨즈)
      youtube_channel_id: "UCdY9ynhPfqPOTpYbhZoUjSw"   # @8ightseconds (8초 TV)

  musinsa_standard:
    name: 무신사 스탠다드
    site:
      shopping:
        queries: ["무신사 스탠다드"]
        brand_names: ["무신사 스탠다드", "MUSINSA STANDARD"]
        malls: []
    news:
      keywords: ["무신사 스탠다드", "무신사스탠다드"]
      exclude: []
    sns:
      instagram: "musinsa_standard"                       # 무신사 스탠다드
      youtube_channel_id: "UCjMOTPlDtPm5dxOO1Yrsaag"   # @mutandardTV (무탠다드TV)

  uniqlo:
    name: 유니클로
    site:
      shopping:
        queries: ["유니클로"]
        brand_names: ["유니클로", "UNIQLO"]
        malls: []
    news:
      keywords: ["유니클로", "UNIQLO"]
      # 실데이터(2026-11-23)에서 유니클로가 스치듯 나온 무관 기사만 뺀다
      # - 코웨이: 펀드매니저 추천 종목 기사 (같이 뽑힌 종목의 모기업이 유니클로)
      # - 유니클로 필드: 다저스 경기장 이름
      # 한 번씩만 나온 애매한 기사(입점 쇼핑몰 언급 등)는 C의 LLM 분류(무관 필터)에 맡긴다
      exclude: ["코웨이", "유니클로 필드", "UNIQLO Field"]
    sns:
      instagram: "uniqlokr"                               # 유니클로 코리아 (글로벌 @uniqlo 아님)
      youtube_channel_id: "UCKnFIIjrAjZVBEMtwztW5hA"   # @uniqlokorea (유니클로 UNIQLO)
