# 브랜드별 수집 대상 (담당: B 주도, 사이트 URL은 A가 채움)
# ⚠ URL·계정은 1주차에 직접 확인 후 채울 것. robots.txt 에서 금지된 경로는 넣지 않는다.
brands:
  spao:
    name: 스파오
    site:
      urls: []                     # 공식몰은 robots.txt 로 봇 차단 → 직접 수집 안 함 (app/site_monitor/ROBOTS.md)
      via: naver_shopping          # 있으면 네이버 쇼핑 검색 API 수집기 사용
      naver_shopping:
        queries: ["스파오"]         # 검색어
        brands: ["스파오", "SPAO"]  # 응답 brand/maker 가 이 중 하나인 상품만 (띄어쓰기·대소문자 무시)
        malls: []                  # TODO(A): 실호출로 mallName 확인 후 공식 판매처로 좁힘
        max_items: 300             # 검색어당 최대 조회 수
        sort: date                 # 최신 등록순
    news:
      keywords: ["스파오", "SPAO"]
      exclude: []         # TODO(B): 무관 기사 제외어
    sns:
      instagram: ""       # TODO(B): 공식 계정 username
      youtube_channel_id: ""

  8seconds:
    name: 에잇세컨즈
    site:
      urls: []                     # ssfshop.com robots.txt 차단
      via: naver_shopping
      naver_shopping:
        queries: ["에잇세컨즈"]
        brands: ["에잇세컨즈", "8seconds"]
        malls: []
        max_items: 300
        sort: date
    news:
      keywords: ["에잇세컨즈", "8seconds"]
      exclude: []
    sns:
      instagram: ""
      youtube_channel_id: ""

  musinsa_standard:
    name: 무신사 스탠다드
    site:
      urls: []                     # musinsa.com robots.txt 차단
      via: naver_shopping
      naver_shopping:
        queries: ["무신사 스탠다드"]
        brands: ["무신사스탠다드", "MUSINSA STANDARD"]
        malls: []
        max_items: 300
        sort: date
    news:
      keywords: ["무신사 스탠다드", "무신사스탠다드"]
      exclude: []
    sns:
      instagram: ""
      youtube_channel_id: ""

  uniqlo:
    name: 유니클로
    site:
      urls: []                     # robots.txt 는 허용하나 실제로는 403/타임아웃 차단
      via: naver_shopping
      naver_shopping:
        queries: ["유니클로"]
        brands: ["유니클로", "UNIQLO"]
        malls: []
        max_items: 300
        sort: date
    news:
      keywords: ["유니클로", "UNIQLO"]
      exclude: []
    sns:
      instagram: ""
      youtube_channel_id: ""

  whoau:
    name: 후아유
    site:
      # 학습용 직접 수집. robots.txt 허용(2026-11-23 확인). 정렬·필터·검색 URL(sort=, filter=, search.html)은 넣지 않는다.
      # 카테고리를 늘릴 땐 요청 수(하루 1회, 5초 간격)를 함께 고려할 것.
      urls:
        - https://www.whoau.com/product/list.html?cate_no=101
    news:
      keywords: ["후아유", "WHO.A.U"]
      exclude: []
    sns:
      instagram: ""
      youtube_channel_id: ""
