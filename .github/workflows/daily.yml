name: daily-collect
on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST (UTC 21:00)
  workflow_dispatch:
concurrency:               # daily 와 weekly 는 같은 그룹: 수집·분류가 끝난 뒤에야 주간 리포트가 시작된다
  group: monitor-pipeline
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      SLACK_WEBHOOK_REPORT: ${{ secrets.SLACK_WEBHOOK_REPORT }}   # 중요도 5 긴급 알림
      SLACK_WEBHOOK_OPS: ${{ secrets.SLACK_WEBHOOK_OPS }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}   # 운영 DB(PostgreSQL). 비어 있으면 러너 안의 SQLite(실행마다 초기화)
      REQUIRE_DATABASE_URL: "1"   # DATABASE_URL 이 비어 있으면 임시 SQLite 로 내려가지 않고 실패한다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - id: install
        run: pip install -e . -c constraints.txt && playwright install --with-deps chromium
      # 수집 단계는 앞 단계가 실패해도(일부 브랜드 실패 → exit 1) 각각 실행한다. 설치가 실패했으면 건너뛴다.
      - name: collect site
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m app collect --source site
      - name: collect news
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m app collect --source news
      - name: collect sns
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m app collect --source sns
      - name: classify
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m app classify
      - name: prune snapshots
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m app prune
