name: daily-collect
on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST (UTC 21:00)
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      SLACK_WEBHOOK_OPS: ${{ secrets.SLACK_WEBHOOK_OPS }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}   # TODO(D): 운영 DB(PostgreSQL) 전환 시 사용
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e . && playwright install --with-deps chromium
      - run: python -m app collect --source site
      - run: python -m app collect --source news
        if: ${{ !cancelled() }}   # 앞 단계가 실패해도 계속
      - run: python -m app collect --source sns
        if: ${{ !cancelled() }}   # 앞 단계가 실패해도 계속
      - run: python -m app classify
        if: ${{ !cancelled() }}   # 앞 단계가 실패해도 계속
